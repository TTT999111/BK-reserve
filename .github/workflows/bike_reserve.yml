name: docomo bike auto reserve

on:
  # 外部cron (cron-job.org) から workflow_dispatch API で起動。
  # GitHub Actions schedule は遅延・スキップが多いため使わない。
  workflow_dispatch:

concurrency:
  group: bike-reserve
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write  # 古いキャッシュ削除のため
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Compute date for cache key
        id: cachekey
        env:
          TZ: Asia/Tokyo
        run: echo "date=$(date +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Restore state cache
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: logs
          # 当日 prefix で前のtickが保存した最新のキャッシュを取り出す
          key: bike-state-${{ steps.cachekey.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            bike-state-${{ steps.cachekey.outputs.date }}-

      - name: Build config.json from secrets
        env:
          SESSION_ID: ${{ secrets.SESSION_ID }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          cat > config.json <<EOF
          {
              "session_id": "${SESSION_ID}",
              "api_key": "${API_KEY}",
              "parks": [
                  {"park_id": "00010147", "park_name": "H1-29.skyz tower&garden"},
                  {"park_id": "00010406", "park_name": "H1-68.芝浦工業大学附属中学高等学校"},
                  {"park_id": "00010223", "park_name": "H1-44.テプコ豊洲ビル"}
              ],
              "reserve_interval_minutes": 18,
              "start_hour": 7,
              "start_minute": 0,
              "end_hour": 9,
              "end_minute": 0,
              "prefer_battery_level_min": 2,
              "prefer_csa_type": 1
          }
          EOF

      - name: Run tick
        env:
          TZ: Asia/Tokyo
        run: python3 docomo_bike_tick.py

      - name: Save state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: logs
          key: bike-state-${{ steps.cachekey.outputs.date }}-${{ github.run_id }}
